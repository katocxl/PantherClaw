#
# sqlc: typed, parameterized queries (SB-1 safe APIs). Run `task gen`.
# Schema comes from the goose migrations; queries live in queries/*.sql and
# always qualify tables with schema pc. Generated code is committed.
version: "2"
sql:
  - engine: postgresql
    schema:
      - internal/platform/db/bootstrap_database.sql
      - migrations
    queries: queries
    gen:
      go:
        package: dbq
        out: internal/gen/dbq
        sql_package: pgx/v5
        emit_empty_slices: true
        emit_exported_queries: false
        emit_json_tags: false
        query_parameter_limit: 3
        overrides:
          - db_type: uuid
            go_type: github.com/katocxl/pantherclaw/internal/platform/ids.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/katocxl/pantherclaw/internal/platform/ids
              type: UUID
              pointer: true
          - column: "pc.*.org_id"
            go_type: github.com/katocxl/pantherclaw/internal/platform/ids.OrgID
          - column: "pc.orgs.id"
            go_type: github.com/katocxl/pantherclaw/internal/platform/ids.OrgID
          - db_type: text
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: numeric
            go_type: github.com/katocxl/pantherclaw/internal/platform/money.Decimal
          - db_type: pg_catalog.numeric
            go_type: github.com/katocxl/pantherclaw/internal/platform/money.Decimal
