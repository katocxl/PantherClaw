syntax = "proto3";

package pantherclaw.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// PackageService imports tool packages and manages their lifecycle (HR-123,
// HR-124, T-036; G0 M4). A package gives every operation its reviewed
// meaning. Only packages listed in a targets document signed by a trusted
// package root can be imported, and version pins only move forward.
// Importing and activating are separate steps: activation is human only.
service PackageService {
  // ImportPackage verifies and stores one package version. It starts as
  // REVIEWED and decides nothing until it is activated.
  // permission: package.import
  rpc ImportPackage(ImportPackageRequest) returns (ImportPackageResponse);
  // TransitionPackage moves a package version through its lifecycle.
  // Quarantining or retiring one invalidates permits already issued.
  // permission: package.activate
  rpc TransitionPackage(TransitionPackageRequest) returns (TransitionPackageResponse);
  // ListPackages lists imported package versions.
  // permission: package.read
  rpc ListPackages(ListPackagesRequest) returns (ListPackagesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // GetDefinition returns one action definition by digest.
  // permission: package.read
  rpc GetDefinition(GetDefinitionRequest) returns (GetDefinitionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // RegisterSigningKey registers an org package-signing public key (HR-162,
  // Team edition and above). Only a person can register one; packages listed
  // in targets signed with it can then be imported into this org.
  // permission: package.key.manage
  rpc RegisterSigningKey(RegisterSigningKeyRequest) returns (RegisterSigningKeyResponse);
  // RevokeSigningKey revokes an org package-signing key. COMPROMISED also
  // withdraws every version it signed and invalidates permits already
  // issued; ROTATED keeps them.
  // permission: package.key.manage
  rpc RevokeSigningKey(RevokeSigningKeyRequest) returns (RevokeSigningKeyResponse);
  // ListSigningKeys lists the org's package-signing keys.
  // permission: package.read
  rpc ListSigningKeys(ListSigningKeysRequest) returns (ListSigningKeysResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// PackageState is a package version's lifecycle state (F394).
enum PackageState {
  PACKAGE_STATE_UNSPECIFIED = 0;
  PACKAGE_STATE_UNCLASSIFIED = 1;
  PACKAGE_STATE_DRAFT = 2;
  PACKAGE_STATE_REVIEWED = 3;
  // Its definitions decide actions.
  PACKAGE_STATE_ACTIVE = 4;
  // Past a definition's review date: CANNOT_AUTHORIZE.
  PACKAGE_STATE_STALE = 5;
  // Withdrawn for a problem: DENY.
  PACKAGE_STATE_QUARANTINED = 6;
  PACKAGE_STATE_RETIRED = 7;
}

// DefinitionRef names one action definition of a package.
message DefinitionRef {
  // Operation, for example payments.refund.create.
  string operation = 1;
  // Definition digest ("sha256:" and 64 hex digits), as ActionIR pins it.
  string digest = 2;
}

// PackageVersion is one imported package version.
message PackageVersion {
  // Package name, for example pc.mock-payments.
  string name = 1;
  // Version.
  string version = 2;
  // Lifecycle state.
  PackageState state = 3;
  // SHA-256 (hex) of the exact signed package bytes.
  string file_digest = 4;
  // Its definitions.
  repeated DefinitionRef definitions = 5;
  // Whether the org's pin points at this version.
  bool pinned = 6;
  // When it was imported.
  google.protobuf.Timestamp import_time = 7;
  // Kid of the org package-signing key that signed it; empty when
  // PantherClaw's package root did.
  string signing_key = 8;
}

// ImportPackageRequest carries a package and the signed metadata that
// lists it.
message ImportPackageRequest {
  // Package name.
  string name = 1 [(buf.validate.field).string = {
    max_len: 128
    pattern: "^[a-z][a-z0-9-]*(\\.[a-z][a-z0-9-]*){0,3}$"
  }];
  // Version.
  string version = 2 [(buf.validate.field).string = {
    max_len: 64
    pattern: "^(0|[1-9][0-9]{0,5})\\.(0|[1-9][0-9]{0,5})\\.(0|[1-9][0-9]{0,5})$"
  }];
  // Targets metadata (compact JWS, typ pc-package-targets+jwt).
  string targets = 3 [(buf.validate.field).string = {
    min_len: 16
    max_len: 262144
  }];
  // The exact package bytes (YAML, format 1).
  bytes package = 4 [(buf.validate.field).bytes = {
    min_len: 1
    max_len: 1048576
  }];
}

// ImportPackageResponse returns the stored version.
message ImportPackageResponse {
  // The version.
  PackageVersion package = 1;
  // Whether the same bytes were already imported (nothing changed).
  bool already_imported = 2;
}

// TransitionPackageRequest changes a version's state.
message TransitionPackageRequest {
  // Package name.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  // Version.
  string version = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // Target state.
  PackageState state = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// TransitionPackageResponse returns the version.
message TransitionPackageResponse {
  // The version.
  PackageVersion package = 1;
}

// ListPackagesRequest lists package versions.
message ListPackagesRequest {
  // Only this package (all when empty).
  string name = 1 [(buf.validate.field).string.max_len = 128];
}

// ListPackagesResponse returns them.
message ListPackagesResponse {
  // Versions, by name then version.
  repeated PackageVersion packages = 1;
}

// GetDefinitionRequest names a definition.
message GetDefinitionRequest {
  // Definition digest.
  string digest = 1 [(buf.validate.field).string.pattern = "^sha256:[0-9a-f]{64}$"];
}

// GetDefinitionResponse returns it.
message GetDefinitionResponse {
  // Operation.
  string operation = 1;
  // Digest.
  string digest = 2;
  // The definition as canonical JSON (RFC 8785).
  bytes definition = 3;
  // Package name.
  string package = 4;
  // Package version.
  string version = 5;
  // The version's state.
  PackageState state = 6;
}

// SigningKeyState is an org package-signing key's state.
enum SigningKeyState {
  SIGNING_KEY_STATE_UNSPECIFIED = 0;
  // Packages signed with it can be imported.
  SIGNING_KEY_STATE_ACTIVE = 1;
  // It verifies nothing any more and can never be registered again.
  SIGNING_KEY_STATE_REVOKED = 2;
}

// SigningKeyRevokeReason says why a key was revoked.
enum SigningKeyRevokeReason {
  SIGNING_KEY_REVOKE_REASON_UNSPECIFIED = 0;
  // Replaced by another key; what it signed keeps working.
  SIGNING_KEY_REVOKE_REASON_ROTATED = 1;
  // Someone else may hold it: what it signed is withdrawn for good.
  SIGNING_KEY_REVOKE_REASON_COMPROMISED = 2;
}

// SigningKey is an org package-signing key (its public half only).
message SigningKey {
  // Key id: "org-packages-" and the start of the key's JWK thumbprint.
  string kid = 1;
  // Name.
  string name = 2;
  // The public key as a JWK (JSON).
  string public_jwk = 3;
  // State.
  SigningKeyState state = 4;
  // Why it was revoked (when revoked).
  SigningKeyRevokeReason revoke_reason = 5;
  // Who registered it ("user:<id>").
  string created_by = 6;
  // When it was registered.
  google.protobuf.Timestamp create_time = 7;
  // Who revoked it.
  string revoked_by = 8;
  // When it was revoked.
  google.protobuf.Timestamp revoke_time = 9;
  // The highest targets version accepted under it (0 before its first
  // import). Sign the next targets with a higher version.
  int64 metadata_version = 10;
}

// RegisterSigningKeyRequest carries the public half of a key the org keeps
// offline (pclaw package key create).
message RegisterSigningKeyRequest {
  // A name for people.
  string name = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9 ._-]{0,63}$"];
  // The Ed25519 public key as a JWK (JSON). Private members are refused.
  string public_jwk = 2 [(buf.validate.field).string = {
    min_len: 16
    max_len: 1024
  }];
}

// RegisterSigningKeyResponse returns the key.
message RegisterSigningKeyResponse {
  // The key.
  SigningKey key = 1;
}

// RevokeSigningKeyRequest names a key and why it is revoked.
message RevokeSigningKeyRequest {
  // Key id.
  string kid = 1 [(buf.validate.field).string.pattern = "^org-packages-[A-Za-z0-9_-]{22}$"];
  // Reason.
  SigningKeyRevokeReason reason = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// RevokeSigningKeyResponse returns the key and what was withdrawn.
message RevokeSigningKeyResponse {
  // The key.
  SigningKey key = 1;
  // For COMPROMISED: each version withdrawn, with its new state.
  repeated PackageVersion withdrawn = 2;
}

// ListSigningKeysRequest lists the org's keys.
message ListSigningKeysRequest {}

// ListSigningKeysResponse returns them, newest first.
message ListSigningKeysResponse {
  // Keys.
  repeated SigningKey keys = 1;
}
