name: Bug report
description: Something does not behave as documented (not a security vulnerability).
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Security issues must be reported privately** via the Security tab, never here."
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `pclaw version` / `pantherclaw-server --version`.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [server, gateway, pclaw CLI, Go SDK, Python SDK, TypeScript SDK, Claude Code integration, docs, other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
      description: Use synthetic data only. Never paste secrets, tokens or customer data.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
