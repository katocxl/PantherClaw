#
# Dependency updates per docs/security/DEPENDENCY_POLICY.md: weekly, grouped,
# 7-day cooldown on new releases (security updates are not delayed).
#
# Version-update PRs are switched off (open-pull-requests-limit: 0) while
# EX-004 is active; raise the limits again to turn them back on.
version: 2

updates:
  - package-ecosystem: gomod
    directories:
      - "/"
      - "/sdk/go"
      - "/tools"
      - "/tools/pins/*"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      go-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "build(deps)"
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
    open-pull-requests-limit: 0

  - package-ecosystem: docker-compose
    directory: "/deploy/compose"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
    open-pull-requests-limit: 0

  - package-ecosystem: devcontainers
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
    open-pull-requests-limit: 0
