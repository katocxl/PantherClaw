#
# Independent AI security review (SG10/SG11), reviewer A = Claude.
# Reviewer B = CodeRabbit (GitHub App, different vendor/model).
# Advisory only: AI approval never satisfies a required human review (EX-001).
# Runs only for same-repository PRs (fork PRs receive no secrets) and only when
# the founder has configured CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`).
name: ai-review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-security-review:
    name: claude security review
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Check reviewer credentials
        id: creds
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: echo "present=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        if: steps.creds.outputs.present == 'true'
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.creds.outputs.present == 'true'
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: anthropics/claude-code-action@97c53473391bff1901034d4b454b5bac7ab7a029 # v1.0.239
        if: steps.creds.outputs.present == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_sticky_comment: true
          claude_args: >-
            --max-turns 20
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment"
          prompt: |
            You are reviewer A in PantherClaw's independent security review (docs/security/GATES_AND_REVIEW.md §6).
            Review ONLY the changes in this pull request (base: ${{ github.event.pull_request.base.sha }}, head: ${{ github.event.pull_request.head.sha }}).
            First read docs/security/HARDENING_RULES.md, docs/security/THREAT_MODEL.md and docs/security/SECURITY_BASELINES.md.
            Then:
            1. Identify insecure patterns in the changed code and relevant call paths.
            2. Propose concrete safer alternatives with trade-offs.
            3. Explain attack vectors: entry point, attacker capability, preconditions, affected asset, consequence.
            4. Map each finding to OWASP Top 10:2025 / API Top 10 2023 / CWE categories from docs/security/OWASP_CWE_MAPPING.md and to HR-/T- IDs.
            Pay special attention to tenancy, authentication/authorization, input validation and canonicalization, secrets/crypto/logging,
            dependencies, and the product invariants (approval binding, revocation, budgets, coverage labels, evidence integrity, fail-closed).
            For each finding give: file:line, evidence, severity, uncertainty, the fix, and a test that would verify it.
            Never print secrets. Report missing context explicitly; model confidence is not proof.
            Post one summary comment and inline comments only for concrete findings. If there are no findings, say so briefly.
      - name: Reviewer not configured
        if: steps.creds.outputs.present != 'true'
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set; AI review skipped (see BUILD_GUIDE Day-0 checklist)."
